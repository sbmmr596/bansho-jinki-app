<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8dee6"/>
      <stop offset="28%" stop-color="#8a929c"/>
      <stop offset="62%" stop-color="#3e464e"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="tf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9aa2ac"/>
      <stop offset="50%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#6a727c"/>
    </linearGradient>
    <pattern id="tp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 H20 M10 0 V20" stroke="#c8d0d8" stroke-width=".6" opacity=".12"/>
    </pattern>
    <radialGradient id="tv" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#tg)"/>
  <rect width="400" height="600" fill="url(#tp)"/>
  <rect width="400" height="600" fill="url(#tv)"/>
  <rect x="10" y="10" width="380" height="580" rx="8" stroke="url(#tf)" stroke-width="3.5" opacity=".9"/>
  <rect x="24" y="24" width="352" height="552" rx="4" stroke="#e4e8ee" stroke-width="1.2" opacity=".35"/>
  <rect x="38" y="38" width="324" height="524" rx="2" stroke="#8a929c" stroke-width=".8" opacity=".3"/>
  <!-- rivets -->
  <g fill="#e8edf2" opacity=".7">
    <circle cx="28" cy="28" r="5"/><circle cx="372" cy="28" r="5"/>
    <circle cx="28" cy="572" r="5"/><circle cx="372" cy="572" r="5"/>
    <circle cx="28" cy="200" r="3.5"/><circle cx="372" cy="200" r="3.5"/>
    <circle cx="28" cy="400" r="3.5"/><circle cx="372" cy="400" r="3.5"/>
  </g>
  <!-- plate lines -->
  <g stroke="#c8d0d8" stroke-width="1.5" opacity=".28">
    <path d="M50 120 H350 M50 480 H350"/>
    <path d="M70 160 H330 M70 440 H330"/>
  </g>
  <!-- emblem: iron diamond -->
  <g opacity=".5" transform="translate(200 220)">
    <path d="M0-100 L86 0 L0 100 L-86 0 Z" stroke="#e8edf2" stroke-width="4"/>
    <path d="M0-68 L58 0 L0 68 L-58 0 Z" stroke="#a8b0b8" stroke-width="2" opacity=".7"/>
    <path d="M0-42 L36 0 L0 42 L-36 0 Z" fill="#e8edf2" opacity=".65"/>
    <path d="M0-22 L18 0 L0 22 L-18 0 Z" fill="#2a3038"/>
  </g>
  <!-- bottom armor bar -->
  <rect x="48" y="540" width="304" height="10" rx="2" fill="#a8b0b8" opacity=".2"/>
</svg>
