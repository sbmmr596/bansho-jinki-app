<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0d0"/>
      <stop offset="25%" stop-color="#7aaa68"/>
      <stop offset="60%" stop-color="#2e5a34"/>
      <stop offset="100%" stop-color="#0c1a0e"/>
    </linearGradient>
    <linearGradient id="rf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f8d8"/>
      <stop offset="50%" stop-color="#6a9a60"/>
      <stop offset="100%" stop-color="#c8dca0"/>
    </linearGradient>
    <pattern id="rp" width="32" height="18" patternUnits="userSpaceOnUse">
      <path d="M16 2 C10 8 10 14 16 16 C22 14 22 8 16 2 Z" stroke="#dce8c8" stroke-width=".7" opacity=".12" fill="none"/>
    </pattern>
    <radialGradient id="rv" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#rg)"/>
  <rect width="400" height="600" fill="url(#rp)"/>
  <rect width="400" height="600" fill="url(#rv)"/>
  <rect x="10" y="10" width="380" height="580" rx="18" stroke="url(#rf)" stroke-width="3" opacity=".85"/>
  <rect x="22" y="22" width="356" height="556" rx="14" stroke="#e8f0d0" stroke-width="1.2" opacity=".38"/>
  <!-- vine corners -->
  <g stroke="#dce8c8" stroke-width="1.5" opacity=".5" fill="none">
    <path d="M40 80 C50 50 80 45 90 60 C70 55 55 70 52 95"/>
    <path d="M360 80 C350 50 320 45 310 60 C330 55 345 70 348 95"/>
    <path d="M40 520 C50 550 80 555 90 540 C70 545 55 530 52 505"/>
    <path d="M360 520 C350 550 320 555 310 540 C330 545 345 530 348 505"/>
  </g>
  <!-- emblem: spirit beast eye / moon -->
  <g opacity=".48" transform="translate(200 200)">
    <circle r="112" stroke="#e8f0d0" stroke-width="5"/>
    <circle r="78" stroke="#a8c888" stroke-width="1.5" opacity=".55"/>
    <circle r="52" fill="#dce8c8" opacity=".25"/>
    <circle cx="14" cy="-8" r="40" fill="#f4ead0" opacity=".8"/>
    <circle cx="26" cy="-14" r="26" fill="#2e5a34" opacity=".75"/>
    <circle cx="30" cy="-16" r="8" fill="#f4ead0" opacity=".7"/>
    <path d="M0-70 L28-18 L0-28 L-28-18 Z" fill="#f4ead0" opacity=".85"/>
  </g>
  <!-- ground mound -->
  <path d="M30 560 Q200 500 370 560 Q200 590 30 560 Z" fill="#1e3a1c" opacity=".35"/>
  <path d="M50 552 Q200 515 350 552" stroke="#a8c888" stroke-width="2" opacity=".3"/>
</svg>
