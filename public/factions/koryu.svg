<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <radialGradient id="kg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#f7e6a8"/>
      <stop offset="35%" stop-color="#c9a04a"/>
      <stop offset="72%" stop-color="#6a4818"/>
      <stop offset="100%" stop-color="#1e1206"/>
    </radialGradient>
    <linearGradient id="kf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4c8" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#d4a84a" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#8a6020" stop-opacity=".85"/>
