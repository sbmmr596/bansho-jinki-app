<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <radialGradient id="yg" cx="50%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#c8c0e8"/>
      <stop offset="30%" stop-color="#5a5488"/>
      <stop offset="65%" stop-color="#242038"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </radialGradient>
    <linearGradient id="yf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ece6ff"/>
      <stop offset="50%" stop-color="#7a70b0"/>
      <stop offset="100%" stop-color="#b0a8d8"/>
    </linearGradient>
    <pattern id="yp" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r=".8" fill="#ece6ff" opacity=".15"/>
      <circle cx="28" cy="30" r=".6" fill="#ece6ff" opacity=".12"/>
      <circle cx="20" cy="6" r=".5" fill="#ece6ff" opacity=".1"/>
    </pattern>
    <radialGradient id="yv" cx="50%" cy="78%" r="52%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#yg)"/>
  <rect width="400" height="600" fill="url(#yp)"/>
  <rect width="400" height="600" fill="url(#yv)"/>
  <rect x="10" y="10" width="380" height="580" rx="20" stroke="url(#yf)" stroke-width="3" opacity=".85"/>
  <rect x="22" y="22" width="356" height="556" rx="16" stroke="#d8d0f4" stroke-width="1.2" opacity=".38"/>
  <!-- mist arcs -->
  <g stroke="#c8c0e8" stroke-width="1.2" opacity=".28" fill="none">
    <path d="M40 140 Q120 100 200 140 T360 140"/>
    <path d="M50 460 Q140 420 200 450 T350 460"/>
  </g>
  <!-- corner crescents -->
  <g stroke="#ece6ff" stroke-width="1.6" opacity=".45" fill="none">
    <path d="M48 70 A18 18 0 0 1 70 48"/>
    <path d="M352 70 A18 18 0 0 0 330 48"/>
    <path d="M48 530 A18 18 0 0 0 70 552"/>
    <path d="M352 530 A18 18 0 0 1 330 552"/>
  </g>
  <!-- emblem: crescent + aura -->
  <g opacity=".5" transform="translate(200 195)">
    <circle r="100" stroke="#d8d0f4" stroke-width="4"/>
    <circle r="72" stroke="#8a80c0" stroke-width="1.5" opacity=".5" stroke-dasharray="3 5"/>
    <path d="M28-55 A62 62 0 1 1 28 55 A46 46 0 1 0 28-55" fill="#ece6ff" opacity=".78"/>
    <circle cx="-36" cy="-48" r="3" fill="#ece6ff" opacity=".6"/>
    <circle cx="52" cy="40" r="2.2" fill="#ece6ff" opacity=".5"/>
    <circle cx="-58" cy="30" r="1.8" fill="#ece6ff" opacity=".45"/>
  </g>
  <path d="M30 555 Q200 505 370 555" stroke="#b0a8d8" stroke-width="3" opacity=".3"/>
