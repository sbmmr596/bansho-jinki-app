    <circle r="80" stroke="#e06040" stroke-width="1.5" opacity=".5"/>
    <path d="M-70-50 L70 70 M70-50 L-70 70" stroke="#ffd8a0" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <path d="M-70-50 L70 70 M70-50 L-70 70" stroke="#8a2018" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
    <path d="M0-72 C18-40 22-10 0 28 C-22-10 -18-40 0-72 Z" fill="#f8d8a8" opacity=".7"/>
    <path d="M0-48 C10-28 12-8 0 12 C-12-8 -10-28 0-48 Z" fill="#c03820" opacity=".55"/>
