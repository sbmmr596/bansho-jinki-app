<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <radialGradient id="mg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#f09058"/>
      <stop offset="32%" stop-color="#c03820"/>
      <stop offset="68%" stop-color="#5a1010"/>
      <stop offset="100%" stop-color="#0e0404"/>
    </radialGradient>
    <linearGradient id="mf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd0a0"/>
      <stop offset="50%" stop-color="#e06040"/>
      <stop offset="100%" stop-color="#8a2018"/>
    </linearGradient>
    <pattern id="mp" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M14 0 L28 14 L14 28 L0 14 Z" stroke="#ffb080" stroke-width=".7" opacity=".1"/>
    </pattern>
    <radialGradient id="mv" cx="50%" cy="80%" r="52%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#mg)"/>
  <rect width="400" height="600" fill="url(#mp)"/>
  <path d="M50 580 Q110 280 200 80 Q290 280 350 580" fill="#f0a060" opacity=".18"/>
  <path d="M110 580 Q160 320 200 120 Q240 320 290 580" fill="#ffd0a0" opacity=".12"/>
  <rect width="400" height="600" fill="url(#mv)"/>
  <rect x="10" y="10" width="380" height="580" rx="10" stroke="url(#mf)" stroke-width="3.2" opacity=".88"/>
  <rect x="22" y="22" width="356" height="556" rx="6" stroke="#ffd0a0" stroke-width="1.2" opacity=".38"/>
